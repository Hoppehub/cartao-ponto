# Roda a bateria de testes do contador de horas em todo envio e pedido de revisão.
# Uma falha aqui significa que a mudança altera o cálculo ou a leitura do AFD.
name: Testes do contador de horas

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxe dos scripts da página
        run: for f in ponto/js/*.js; do node --check "$f"; done
      - name: Testes do analisador e do cálculo
        run: node testes/test_afd_parser.js
      - name: Conferência independente do cálculo (2000 meses aleatórios)
        run: node testes/test_oraculo.js 2000

  navegador:
    # Tela, relatório e CSV com os mesmos totais; carga concorrente; API de carga.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar o Chromium do Playwright
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Testes no navegador
        run: node testes/test_navegador.js
